# Package `aphotic` — Aphotic x Hashi, "The Bitcoin Dark Vault".
#
# NEW Move package system (sui 1.76.0). Both upstream deps ship a `Published.toml`
# with `[published.testnet]`, so `published-at` / `original-id` resolve automatically
# and NO `[dep-replacements]` and NO `[addresses]` block is required (RECON R3).
#
# NOTE: there is deliberately NO `[environments]` block. `sui` 1.76.0 ships `testnet`
# (chain-id 4c78adac) and `mainnet` as SYSTEM environments; declaring
# `testnet = "4c78adac"` here is rejected at resolution time with:
#   "Cannot override default environments. Environment `testnet` is a system
#    environment and cannot be overridden. System environments: testnet, mainnet"
#
# NOTE: no Pyth dependency (RECON R3). Nothing in Move calls Pyth — `envelope::check_action`
# takes `oracle_mid: u128` as a PARAMETER (docs/MOVE-PACKAGE.md §4.4, G9). Pyth's Sui
# contracts are `edition = "legacy"` with a heavy pinned Wormhole dep.
# NOTE: no Seal / Walrus dependency — both are off-chain SDKs. The only on-chain Seal
# surface is our own `aphotic::vault::seal_approve` (docs/MOVE-PACKAGE.md §3.4).
#
# This file is one of the FOUR places a canonical on-chain id may appear (G7);
# the others are keeper/src/config.ts, app/src/config.ts and the .env.example files.

[package]
name = "aphotic"
edition = "2024.beta"
license = "Apache-2.0"

[dependencies]
hashi    = { git = "https://github.com/MystenLabs/hashi.git",      subdir = "packages/hashi",    rev = "d9ad6bf440a737a23e0a239d4dfe5a6a51a1de9f" }
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "0b6d9cca8975f38cf55c3e9bf5dcca2563b148cb" }
