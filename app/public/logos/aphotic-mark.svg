<!-- Aphotic wordmark/mark, supplied by the project owner.
     viewBox is padded to a SQUARE (source art is 354x226, offset y by -64) so the
     mark centres correctly inside the three circular containers that use it:
       .landing-nav .nav-logo-img      → filter: brightness(0) invert(1) ⇒ renders WHITE
       .landing .beam-circle           → background #fff                 ⇒ needs a DARK fill
       .landing .hscroll-content-icon  → background rgba(255,255,255,.95) ⇒ needs a DARK fill
     Fill is an explicit dark literal (matching logos/globe.svg's #060b11 family),
     NOT currentColor: an SVG loaded through <img> has no inherited colour. -->
