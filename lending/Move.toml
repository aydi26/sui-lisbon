# Package `aphotic_lending` — a REAL, minimal, supply-side hBTC lending market.
#
# WHY THIS PACKAGE EXISTS (read this before assuming it is a mock):
#   Aphotic's idle-yield leg routes hBTC to a lending venue through the pinned adapter
#   allowlist in `aphotic::allocate`. On Sui TESTNET there is nothing to route to —
#   Suilend, Navi and Scallop have no testnet deployment at all, and AlphaLend's markets
#   are testcoins plus SUI, not hBTC. Rather than fake the adapter in TypeScript and
#   report a number nobody can check, we deploy a genuine counterparty and disclose that
#   we are the counterparty. See the honesty block in `sources/lending.move`.
#
# NEW Move package system (sui 1.76.0). The single dependency ships a `Published.toml`
# with `[published.testnet]`, so `published-at` / `original-id` resolve automatically and
# NO `[dep-replacements]` and NO `[addresses]` block is required (docs/RECON.md R3).
#
# There is deliberately NO `[environments]` block: sui 1.76.0 ships `testnet`
# (chain-id 4c78adac) and `mainnet` as SYSTEM environments and rejects an override.
#
# `hashi` is here for exactly one reason: the coin type `hashi::btc::BTC` (hBTC, 8 decimals,
# sats). This package calls NO hashi function — it never touches the bridge, the withdrawal
# queue or the treasury. `grep -n "hashi::" sources/lending.move` returns one `use` line.
#
# ── DEPLOYED — Sui TESTNET (chain-id 4c78adac), 2026-07-26 ────────────────────────────────
# This file is a sanctioned home for canonical on-chain ids (CONVENTIONS.md §2.6 / G7).
#   publish tx                 3PCybDwuxCCxEace2zSrNutPRSNvEKAazPZjbKPTqnJZ   (success)
